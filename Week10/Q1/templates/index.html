<!DOCTYPE html>
<html>
<head>
    <title>Q1</title>
</head>
<body>
    <h1>Website Directory</h1>

    <a href="add-category/">Add Category</a> |
    <a href="add-page/">Add Page</a>

    <h2>Categories</h2>
    <ul>
        {% for category in categories %}
            <li>
                {{ category.name }} 
                (Likes: {{ category.likes }}, Visits: {{ category.visits }})
            </li>
        {% endfor %}
    </ul>

    <h2>Pages</h2>
    <ul>
        {% for page in pages %}
            <li>
                <a href="{{ page.url }}">{{ page.title }}</a>
                (Views: {{ page.views }})
            </li>
        {% endfor %}
    </ul>
</body>
</html>
