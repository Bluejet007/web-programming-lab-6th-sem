<!DOCTYPE html>
<html>
<head>
  <title>A2</title>
  <script src="jquery-4.0.0.min.js"></script>

  <style>
    .image-container {
      position: relative;
      width: 500px;
      overflow: hidden;
      border: 2px solid black;
    }

    .image-container img {
      width: 100%;
      height: 100%;
    }

    .scroll-text {
      position: absolute;
      bottom: 20px;
      left: 100%;
      white-space: nowrap;
      background: #0008;
      color: #fff;
      padding: 8px 15px;
      font-size: 22px;
    }
  </style>
</head>

<body>
  <h2>Auto Scrolling</h2>
  <div class="image-container">
    <img src="cake.png">
    <div class="scroll-text">Happy birthday!</div>
  </div>

  <script>
    $(document).ready(function () {
      function scrollText() {
        let text = $(".scroll-text");
        let containerWidth = $(".image-container").width();
        let textWidth = text.outerWidth();

        text.css({ left: containerWidth + "px" });

        text.animate(
          { left: -textWidth + "px" },
          8000, "linear", scrollText
        );
      }

      scrollText();
    });
  </script>

</body>
</html>
