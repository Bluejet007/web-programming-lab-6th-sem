<!DOCTYPE html>
<html>
<head>
  <title>Q1</title>
  <script src='jquery-4.0.0.min.js'></script>
</head>

<body>
  <style>
    table {
      border-collapse: collapse;
      width: 100%;
    }

    tr:nth-child(even) {
      background-color: #f2f2f2;
    }

    tr:nth-child(odd) {
      background-color: #ffffff;
    }

    #content {
      position: relative;
      left: 300px;
      width: fit-content;
    }

    img {
      margin-top: 5px;
      width: 500px;
    }
  </style>
  <h1>Slide</h1>

  <button id='slideBtn'>Move Left</button>

  <div id='content'>
    <table border>
      <tr>
        <td>Name</td>
        <td>Course</td>
        <td>Preference</td>
      </tr>
      <tr>
        <td>Alice</td>
        <td>BCA</td>
        <td>Email</td>
      </tr>
      <tr>
        <td>Bob</td>
        <td>BSc</td>
        <td>SMS</td>
      </tr>
    </table>

    <img src='./img.png' alt='Sample Image'>
  </div>

  <script>
    $(document).ready(() => {
      $('#slideBtn').click(() => {
        $('#content').animate(
          { left: '0px' }, 1000);
      });
    });
  </script>

</body>
</html>
