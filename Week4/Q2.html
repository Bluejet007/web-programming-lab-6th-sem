<!DOCTYPE html>
<html>

<head>
  <title>Q2</title>
  <script src="jquery-4.0.0.min.js"></script>

  <style>
    .calculator {
      width: 300px;
      padding: 15px;
      border: 2px solid black;
    }

    input {
      width: 95%;
      padding: 8px;
      margin-bottom: 10px;
      font-size: 18px;
    }

    button {
      font-size: 16px;
    }
  </style>
</head>

<body>

  <h2>Calculator</h2>

  <div class="calculator">
    <input type="text" id="num1" placeholder="Number 1">
    <input type="text" id="num2" placeholder="Number 2">
    <input type="text" id="result" placeholder="Result" readonly>
    <br />
    <button id="add">+</button>
    <button id="sub">-</button>
    <button id="mul">*</button>
    <button id="div">/</button>
    <button id="cls">C</button>
  </div>

  <script>
    $(document).ready(() => {
      function op(func) {
        let a = Number($("#num1").val());
        let b = Number($("#num2").val());
        $("#result").val(func(a, b));
      }

      $("#add").click(() => {
        op((a, b) => a + b);
      });

      $("#sub").click(() => {
        op((a, b) => a - b);
      });

      $("#mul").click(() => {
        op((a, b) => a * b);
      });

      $("#div").click(() => {
        op((a, b) => b === 0 ? "#DivByZero" : a / b);
      });

      $("#cls").click(() => {
        $("#num1").val("");
        $("#num2").val("");
        $("#result").val("");
      });
    });
  </script>

</body>

</html>
