<!DOCTYPE html>
<html>
<head>
    <title>Products</title>
</head>
<body>

<h1>Product List</h1>

<a href="{% url 'add_product' %}">Add Product</a>

<ul>
    {% for product in products %}
        <li>
            <strong>{{ product.title }}</strong> - ₹{{ product.price }} <br>
            {{ product.description }}
        </li>
    {% empty %}
        <li>No products available</li>
    {% endfor %}
</ul>

</body>
</html>
