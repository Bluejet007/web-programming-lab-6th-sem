<!DOCTYPE html>
<html>
<head>
    <title>Feedback Form</title>
</head>
<body>
    <h2>Feedback Form</h2>
    <form method="post" style="border: 1px solid #ccc; padding: 20px; width: 300px;">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Submit Form</button>
    </form>

    {% if message %}
        <p style="margin-top: 20px; font-weight: bold; color: green;">
            {{ message }}
        </p>
    {% endif %}
</body>
</html>
