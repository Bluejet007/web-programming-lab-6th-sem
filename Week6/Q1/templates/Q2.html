<!DOCTYPE html>
<html>
<head>
  <title>Q2</title>
  <style>
    body { font-family: sans-serif; display: flex; padding: 20px; gap: 50px; }
    form { width: 250px; display: flex; flex-direction: column; gap: 10px; }

    .cover {
      width: 300px; height: 400px; border: 2px solid #000;
      position: relative; overflow: hidden;
      background-color: {{ bg_color }};
    }

    .bg-img {
      position: absolute; width: 100%; height: 100%;
      background-image: url('{{ img_url }}');
      background-size: cover; background-position: center;
    }

    .title {
      position: relative; text-align: center;
      color: {{ font_color }}; font-size: {{ font_size }}px;
      margin-top: 10px; text-transform: uppercase;
    }

    .headline {
      position: absolute; bottom: 20px; width: 100%;
      text-align: center; font-weight: bold;
      color: {{ font_color }};
      background: rgba(255,255,255,0.6);
    }
  </style>
</head>

<body>
  <form method="POST">
    {% csrf_token %}
    <input type="text" name="title" placeholder="Magazine Title" value="{{ title }}">
    <input type="text" name="headline" placeholder="Main Headline" value="{{ headline }}">
    <input type="text" name="img_url" placeholder="Image URL" value="{{ img_url }}">
    <label>BG Color: <input type="color" name="bg_color" value="{{ bg_color }}"></label>
    <label>Font Color: <input type="color" name="font_color" value="{{ font_color }}"></label>
    <label>Font Size: <input type="number" name="font_size" value="{{ font_size }}"></label>
    <button type="submit">Generate</button>
  </form>

  <div class="cover">
    <div class="bg-img"></div>
    <h1 class="title">{{ title }}</h1>
    <p class="headline">{{ headline }}</p>
  </div>
</body>
</html>
